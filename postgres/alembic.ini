# Alembic configuration. Run from the repo root:
#   uv run alembic -c postgres/alembic.ini upgrade head
# The database URL is NOT here: env.py reads MIGRATION_DATABASE_URL (fd_owner).

[alembic]
# %(here)s = the folder of this file, so it works from any working directory
script_location = %(here)s/migrations
# repo root on sys.path, so env.py can import the app package
prepend_sys_path = %(here)s/..
path_separator = os
# date prefix: files sort in creation order, e.g. 20261105_1a2b3c4d5e6f_grants.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# format every new revision with ruff, so generated files pass `ruff format --check`
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
