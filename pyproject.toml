[project]
name = "food-delivery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Install the project itself into the venv (editable), so scripts in any folder
# (redis/, mongodb/, postgres/seed/, tests/) can `import app` without sys.path hacks.
[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

# The repo has a top-level redis/ folder (scripts), so ruff would treat `import redis`
# as our own code. It is the redis-py library.
[tool.ruff.lint.isort]
known-third-party = ["redis"]
